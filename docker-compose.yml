version: '3.8'

services:
  frontend:
    build:
      context: ..
      dockerfile: breezy-infra/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    volumes:
      - ../breezy-frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - breezy-network
    command: pnpm dev

  backend:
    build:
      context: ..
      dockerfile: breezy-infra/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/breezy
      - JWT_SECRET=your_jwt_secret
      - NODE_ENV=development
    volumes:
      - ../breezy-backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - breezy-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - breezy-network

networks:
  breezy-network:
    driver: bridge

volumes:
  mongodb_data: 
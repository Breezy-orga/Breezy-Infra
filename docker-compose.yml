version: "3.9"

services:
  frontend:
    build:
      context: ..
      dockerfile: breezy-infra/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000/api
      - NODE_ENV=development
    # volumes:
    #   - ../breezy-frontend:/app  # Commenté car cause des problèmes de dépendances
    depends_on:
      - backend
    networks:
      - breezy-network
    command: pnpm start

  backend:
    build:
      context: ..
      dockerfile: breezy-infra/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/breezy
      - JWT_SECRET=dev_secret_jwt
    # volumes:
    #   - ../breezy-backend:/app  # Commenté car cause des problèmes de dépendances
    depends_on:
      - mongodb
    networks:
      - breezy-network
    command: pnpm start

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - breezy-network

networks:
  breezy-network:
    driver: bridge

volumes:
  mongodb_data: